name: pr-issue-link

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a linked issue (warning only)
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            const labels = pr.labels.map((l) => l.name)
            if (labels.includes('no-issue')) {
              core.info('no-issue label present: skipped')
              return
            }
            const linked = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i
            if (!linked.test(pr.body ?? '')) {
              const message =
                'No linked issue: add "Fixes #N" (one per issue) to the PR body, or apply the no-issue label.'
              core.warning(message)
              core.summary.addRaw(message, true)
              await core.summary.write()
            }
