name: Bug report
description: Something is broken or behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What's wrong?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Stream Deck plugin
        - Chrome extension
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, Stream Deck app version, Chrome version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Plugin logs (`%APPDATA%\Elgato\StreamDeck\Plugins\com.rotho.yttv-multiview.sdPlugin\logs\`) or extension service-worker console output.
      render: text
  - type: textarea
    id: cause
    attributes:
      label: Suspected cause / relevant files
    validations:
      required: false
  - type: textarea
    id: fix
    attributes:
      label: Possible fix
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: An input to Priority, which is still set on the project board.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
