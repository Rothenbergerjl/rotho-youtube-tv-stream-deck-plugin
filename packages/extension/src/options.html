<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rotho YTTV Multiview options</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #111418;
        --card: #1a1e24;
        --border: #2b3038;
        --text: #f5f5f5;
        --dim: #9ca3af;
        --on: #22c55e;
        --off: #4b5563;
        --error: #ef4444;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font:
          15px/1.45 "Segoe UI",
          Arial,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      p.intro {
        color: var(--dim);
        margin: 0 0 24px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
      }
      li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
      }
      li + li {
        border-top: 1px solid var(--border);
      }
      .badge {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        box-shadow: 0 0 0 2px var(--border);
      }
      .label {
        flex: 1;
        min-width: 0;
      }
      .name {
        font-weight: 600;
      }
      .note {
        color: var(--dim);
        font-size: 13px;
      }
      .note.error {
        color: var(--error);
      }
      /* Switch */
      .switch {
        position: relative;
        flex: none;
        width: 44px;
        height: 24px;
      }
      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .switch input:disabled {
        cursor: default;
      }
      .track {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background: var(--off);
        transition: background 0.15s;
        pointer-events: none;
      }
      .track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--text);
        transition: transform 0.15s;
      }
      .switch input:checked + .track {
        background: var(--on);
      }
      .switch input:checked + .track::after {
        transform: translateX(20px);
      }
      .switch input:disabled + .track {
        opacity: 0.6;
      }
      .switch input:focus-visible + .track {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Services</h1>
      <p class="intro">
        Player tabs of the services turned on here take Game Slots on your Stream Deck and switch
        audio together.
      </p>
      <ul id="services"></ul>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
