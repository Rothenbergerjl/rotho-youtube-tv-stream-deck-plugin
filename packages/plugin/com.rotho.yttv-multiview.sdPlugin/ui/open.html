<!doctype html>
<html>
  <head lang="en">
    <title>Open YouTube TV Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Open in">
      <sdpi-select setting="target" default="window">
        <option value="window">New window</option>
        <option value="tab">New tab</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item>
      <p>
        A new tab opens in the Chrome window you used last. The new game starts muted and takes the
        next free slot.
      </p>
    </sdpi-item>
  </body>
</html>
