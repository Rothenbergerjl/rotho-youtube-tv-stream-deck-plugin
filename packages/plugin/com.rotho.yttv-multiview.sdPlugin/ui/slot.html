<!doctype html>
<html>
  <head lang="en">
    <title>Game Slot Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Slot">
      <sdpi-select setting="slot" value-type="number" default="1">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item>
      <p>
        Slots are given to YouTube TV tabs in the order they open. Slot 1 is the first game you
        opened.
      </p>
    </sdpi-item>
    <sdpi-item id="update" label="Update" hidden>
      <sdpi-button id="open-update"><div id="update-text"></div></sdpi-button>
    </sdpi-item>
    <script>
      // The plugin answers "getUpdate" and also pushes changes while this panel is open.
      const client = SDPIComponents.streamDeckClient;
      client.sendToPropertyInspector.subscribe(({ payload }) => {
        if (payload?.type !== "update") return;
        document.getElementById("update").hidden = !payload.update;
        if (payload.update) {
          document.getElementById("update-text").textContent =
            `Plugin v${payload.update.version} is available`;
        }
      });
      document
        .getElementById("open-update")
        .addEventListener("click", () => client.send("sendToPlugin", { type: "openUpdate" }));
      client.send("sendToPlugin", { type: "getUpdate" });
    </script>
  </body>
</html>
