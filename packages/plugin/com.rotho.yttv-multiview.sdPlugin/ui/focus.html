<!doctype html>
<html>
  <head lang="en">
    <title>Focus Heard Game Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Team colors">
      <sdpi-checkbox setting="teamColors" default="true"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item>
      <p>
        With Team colors on, the game you're hearing shows each team's colors when the teams are
        known; turn it off for plain text.
      </p>
    </sdpi-item>
  </body>
</html>
