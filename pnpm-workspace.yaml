packages:
  - packages/*

# Shared dependency versions. Packages reference these with "catalog:".
catalog:
  "@elgato/cli": 1.10.2
  "@elgato/streamdeck": 3.0.2
  "@eslint/js": 10.0.1
  "@rollup/plugin-commonjs": 29.0.3
  "@rollup/plugin-node-resolve": 16.0.3
  "@rollup/plugin-terser": 1.0.0
  "@rollup/plugin-typescript": 12.3.0
  "@types/chrome": 0.3.5
  "@types/node": 24.12.0
  "@types/ws": 8.18.2
  esbuild: 0.28.2
  eslint: 10.12.0
  fflate: 0.8.3
  globals: 17.13.0
  prettier: 3.9.10
  rollup: 4.64.5
  tslib: 2.8.1
  # typescript-eslint 8.x supports TypeScript < 6.1, so stay on 6.0.
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  vitest: 5.0.3
  ws: 8.22.0

# Dependencies allowed to run install scripts. Keep this list minimal.
onlyBuiltDependencies:
  - esbuild
